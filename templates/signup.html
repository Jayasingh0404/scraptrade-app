{% extends "base.html" %}
{% block title %}Sign up — ScrapTrade Hub{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto card p-8">
  <h1 class="text-2xl font-bold text-navy mb-1">Create your account</h1>
  <p class="text-sm text-slate-500 mb-6">Join ScrapTrade Hub as a seller or buyer.</p>

  <form method="POST" class="space-y-4" x-data>
    <div>
      <label class="block text-sm font-medium mb-1">I am a</label>
      <div class="grid grid-cols-2 gap-3">
        <label class="border rounded-md p-3 cursor-pointer flex items-center gap-2 hover:border-rust">
          <input type="radio" name="role" value="seller" required checked> Seller
        </label>
        <label class="border rounded-md p-3 cursor-pointer flex items-center gap-2 hover:border-rust">
          <input type="radio" name="role" value="buyer" required> Buyer
        </label>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium mb-1">Full name</label>
        <input name="full_name" required class="w-full border rounded-md px-3 py-2">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Phone</label>
        <input name="phone" class="w-full border rounded-md px-3 py-2">
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">Email</label>
      <input type="email" name="email" required class="w-full border rounded-md px-3 py-2">
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">Password</label>
      <input type="password" name="password" required minlength="6" class="w-full border rounded-md px-3 py-2">
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium mb-1">Business name</label>
        <input name="business_name" class="w-full border rounded-md px-3 py-2">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Location</label>
        <input name="location" placeholder="City, State" class="w-full border rounded-md px-3 py-2">
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">GST number (optional)</label>
      <input name="gst_number" class="w-full border rounded-md px-3 py-2">
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">Seller type (sellers only)</label>
      <select name="seller_type" class="w-full border rounded-md px-3 py-2">
        <option value="normal">Normal Seller</option>
        <option value="verified_deposit">Verified Deposit Seller</option>
      </select>
    </div>

    <button type="submit" class="w-full bg-rust text-white py-2.5 rounded-md font-semibold hover:bg-rust/90 transition shadow-sm">Create account with Email</button>
  </form>

  <div class="relative my-6 text-center">
    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-200"></div></div>
    <span class="relative bg-white px-3 text-xs text-slate-500 uppercase tracking-wider font-semibold">Or continue with</span>
  </div>

  <a href="{{ url_for('google_auth') }}" class="w-full flex items-center justify-center gap-3 border border-slate-300 py-2.5 px-4 rounded-md font-medium text-slate-700 bg-white hover:bg-slate-50 hover:border-slate-400 transition shadow-sm">
    <svg class="w-5 h-5" viewBox="0 0 24 24">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
    </svg>
    <span>Sign up with Google</span>
  </a>

  <p class="text-sm text-slate-500 mt-5 text-center">Already have an account? <a href="{{ url_for('login') }}" class="text-rust font-semibold hover:underline">Log in</a></p>
</div>
{% endblock %}
