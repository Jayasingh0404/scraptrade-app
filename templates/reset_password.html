{% extends "base.html" %}
{% block title %}Reset Password — ScrapTrade Hub{% endblock %}
{% block content %}
<div class="max-w-md mx-auto card p-8">
  <div class="text-center mb-6">
    <div class="w-12 h-12 bg-rust/10 text-rust rounded-full flex items-center justify-center mx-auto mb-3">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
      </svg>
    </div>
    <h1 class="text-2xl font-bold text-navy">Set New Password</h1>
    <p class="text-sm text-slate-500 mt-1">Creating a new password for <span class="font-semibold text-slate-700">{{ email }}</span></p>
  </div>

  <form method="POST" class="space-y-4">
    <div>
      <label class="block text-sm font-medium mb-1 text-slate-700">New Password</label>
      <input type="password" name="password" required minlength="6" autofocus class="w-full border border-slate-300 rounded-md px-3.5 py-2.5 focus:ring-2 focus:ring-rust focus:border-rust" placeholder="At least 6 characters">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1 text-slate-700">Confirm New Password</label>
      <input type="password" name="confirm_password" required minlength="6" class="w-full border border-slate-300 rounded-md px-3.5 py-2.5 focus:ring-2 focus:ring-rust focus:border-rust" placeholder="Re-enter new password">
    </div>
    <button type="submit" class="w-full bg-rust text-white py-2.5 rounded-md font-semibold hover:bg-rust/90 transition shadow-sm">Save & Update Password</button>
  </form>

  <div class="mt-6 text-center border-t pt-4">
    <a href="{{ url_for('login') }}" class="text-sm text-slate-600 hover:text-rust font-medium">Cancel and return to login</a>
  </div>
</div>
{% endblock %}
