{% extends "base.html" %}
{% block title %}New Listing — ScrapTrade Hub{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto card p-8">
  <h1 class="text-2xl font-bold text-navy mb-1">Create scrap listing</h1>
  <p class="text-sm text-slate-500 mb-6">Give buyers what they need to make a fast, fair offer.</p>

  <form method="POST" enctype="multipart/form-data" class="space-y-4">
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium mb-1">Material type</label>
        <input name="material_type" required placeholder="e.g. Aluminium Scrap" class="w-full border rounded-md px-3 py-2">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Category</label>
        <select name="category" required class="w-full border rounded-md px-3 py-2">
          <option>Metal</option>
          <option>Plastic</option>
          <option>Paper</option>
          <option>E-Waste</option>
          <option>Glass</option>
          <option>Rubber</option>
          <option>Wood</option>
          <option>Textiles</option>
          <option>Other</option>
        </select>
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">Grade / quality</label>
      <input name="grade" placeholder="e.g. Grade A, Bright, Mixed" class="w-full border rounded-md px-3 py-2">
    </div>

    <div class="grid grid-cols-3 gap-4">
      <div class="col-span-2">
        <label class="block text-sm font-medium mb-1">Estimated quantity</label>
        <input type="number" step="0.01" name="estimated_quantity" required class="w-full border rounded-md px-3 py-2">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Unit</label>
        <select name="unit" class="w-full border rounded-md px-3 py-2">
          <option value="kg">kg</option>
          <option value="tonnes">tonnes</option>
          <option value="units">units</option>
        </select>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium mb-1">Expected price (₹/unit)</label>
        <input type="number" step="0.01" name="expected_price" required class="w-full border rounded-md px-3 py-2">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Location</label>
        <input name="location" required placeholder="City, State" class="w-full border rounded-md px-3 py-2">
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">Description</label>
      <textarea name="description" rows="3" class="w-full border rounded-md px-3 py-2" placeholder="Condition, contamination, packaging, pickup notes..."></textarea>
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">Material Photo / Lot Image (Optional)</label>
      <input type="file" name="image" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-rust/10 file:text-rust hover:file:bg-rust/20 border rounded-md p-1.5 cursor-pointer">
      <p class="text-xs text-slate-400 mt-1">PNG, JPG, WEBP up to 16MB. Clear photos increase bid volume by 3x.</p>
    </div>

    <button type="submit" class="w-full bg-rust text-white py-2.5 rounded-md font-semibold hover:bg-rust/90 shadow-sm transition">Publish listing</button>
  </form>
</div>
{% endblock %}
